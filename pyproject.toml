[project]
name = "knowledgelens-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "roaa-838", email = "roaaraafatzahran2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
knowledgelens-rag = "knowledgelens_rag:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
